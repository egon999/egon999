<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="850" height="210">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C08"/>
      <stop offset="50%" stop-color="#09150E"/>
      <stop offset="100%" stop-color="#040805"/>
    </linearGradient>

    <!-- Electric Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#132E1D" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Frame -->
  <rect width="850" height="210" rx="16" fill="url(#bgGrad)"/>
  <rect width="850" height="210" rx="16" fill="url(#grid)"/>

  <!-- Cybernetic Wave Elements in Neon Emerald -->
  <path d="M0 160 Q 210 110, 425 155 T 850 135 L 850 210 L 0 210 Z" fill="url(#waveGrad)"/>
  <path d="M0 175 Q 230 130, 440 170 T 850 150" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.2" opacity="0.7"/>
  <path d="M0 185 Q 200 150, 420 180 T 850 165" fill="none" stroke="#00FF88" stroke-width="1.2" opacity="0.4"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="850" height="3" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)"/>
  <rect width="850" height="210" rx="16" fill="none" stroke="#00FF88" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Glowing Corner Accents -->
  <circle cx="28" cy="28" r="3.5" fill="#00FF88" filter="url(#emeraldGlow)"/>
  <circle cx="28" cy="28" r="3.5" fill="#00FF88"/>
  <circle cx="822" cy="28" r="3.5" fill="#00FF88" filter="url(#emeraldGlow)"/>
  <circle cx="822" cy="28" r="3.5" fill="#00FF88"/>

  <!-- Main Title: Ayushman (EGON) -->
  <text x="425" y="86" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="900" fill="#F0FDF4" letter-spacing="1.5">
    AYUSHMAN <tspan fill="#00FF88">(EGON)</tspan>
  </text>

  <!-- Subtitle -->
  <text x="425" y="124" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="16" font-weight="600" fill="#A7F3D0" letter-spacing="0.8">
    Systems &amp; Full-Stack Developer &#8226; 12th Grade Student &#8226; Founder @ Bratz Inc
  </text>

  <!-- Tech Pills / Focus Areas -->
  <g transform="translate(425, 155)">
    <rect x="-240" y="0" width="110" height="24" rx="12" fill="#0E2316" stroke="#00FF88" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="-185" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00FF88">FULL-STACK</text>

    <rect x="-115" y="0" width="110" height="24" rx="12" fill="#0E2316" stroke="#00FF88" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="-60" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00FF88">AI SWARMS</text>

    <rect x="10" y="0" width="110" height="24" rx="12" fill="#0E2316" stroke="#00FF88" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="65" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00FF88">WIN32 / NT</text>

    <rect x="135" y="0" width="110" height="24" rx="12" fill="#0E2316" stroke="#00FF88" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="190" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00FF88">CREATIVE</text>
  </g>
</svg>
