        <text x="30" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#F8FAFC">Node.js</text>
        <rect x="66" y="0" width="68" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="100" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#FDE047">Firestore</text>
