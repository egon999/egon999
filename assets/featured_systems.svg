        <tspan x="18" dy="16">&amp; evidence vault for Android.</tspan>
        <tspan x="18" dy="16">Features AI query assistant,</tspan>
        <tspan x="18" dy="16">financial dispute forensics, &amp;</tspan>
        <tspan x="18" dy="16">detective animation physics.</tspan>
      </text>

      <!-- Tags -->
      <g transform="translate(18, 195)">
        <rect x="0" y="0" width="82" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="41" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#38BDF8">React Native</text>
        <rect x="88" y="0" width="70" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="123" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#F8FAFC">Expo SDK</text>
      </g>
      <g transform="translate(18, 222)">
