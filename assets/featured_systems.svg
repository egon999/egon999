<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
  <defs>
    <linearGradient id="systemsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040805"/>
      <stop offset="50%" stop-color="#08140D"/>
      <stop offset="100%" stop-color="#040805"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07130A"/>
      <stop offset="100%" stop-color="#0D2214"/>
    </linearGradient>
    <linearGradient id="emeraldTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="426" rx="24" fill="url(#systemsBg)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Section Header -->
  <g transform="translate(440, 42)" text-anchor="middle">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="900" fill="#F8FAFC">
      ✨ Featured Systems &amp; <tspan fill="url(#emeraldTitle)">Architecture</tspan> ✨
    </text>
    <text x="0" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">
      PRODUCTION-GRADE ENTERPRISE PLATFORMS &amp; SYSTEMS
    </text>
  </g>

  <!-- 3 Project Cards Row -->
  <g transform="translate(48, 100)">
    <!-- Card 1: Elevate ERP -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="248" height="290" rx="18" fill="url(#cardGrad)" stroke="#00FF88" stroke-width="1.2" stroke-opacity="0.5"/>
      <!-- Year Badge -->
      <rect x="180" y="16" width="52" height="22" rx="11" fill="#0B2014" stroke="#00FF88" stroke-width="1" stroke-opacity="0.4"/>
      <text x="206" y="31" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#00FF88">2026</text>
      
      <!-- Title -->
      <text x="18" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Elevate ERP</text>
      <text x="18" y="64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981">Autonomous School ERP Core</text>

      <!-- Description -->
      <text x="18" y="92" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">
        <tspan x="18" dy="0">World's 1st Agent-Powered</tspan>
        <tspan x="18" dy="16">educational ERP. Features CBSE</tspan>
        <tspan x="18" dy="16">blueprint AI paper synthesis,</tspan>
        <tspan x="18" dy="16">Razorpay billing automation, &amp;</tspan>
        <tspan x="18" dy="16">multi-tenant isolation.</tspan>
      </text>

      <!-- Tags -->
      <g transform="translate(18, 195)">
        <rect x="0" y="0" width="94" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="47" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#34D399">Autonomous AI</text>
        <rect x="100" y="0" width="62" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="131" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#F8FAFC">Next.js 15</text>
