        <text x="34" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#F8FAFC">React 19</text>
        <rect x="74" y="0" width="88" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="118" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#38BDF8">Private Core</text>
