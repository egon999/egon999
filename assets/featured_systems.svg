      <text x="18" y="64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981">Multi-Model AI Proxy</text>

      <!-- Description -->
      <text x="18" y="92" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">
