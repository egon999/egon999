        <tspan x="18" dy="16">compatible AI proxy gateway.</tspan>
        <tspan x="18" dy="16">Zero-markup cookie sessions,</tspan>
        <tspan x="18" dy="16">automated failover routing, &amp;</tspan>
        <tspan x="18" dy="16">live token streaming.</tspan>
      </text>

      <!-- Tags -->
      <g transform="translate(18, 195)">
        <rect x="0" y="0" width="60" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="30" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#FDE047">Python</text>
        <rect x="66" y="0" width="76" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="104" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#34D399">OpenAI API</text>
      </g>
      <g transform="translate(18, 222)">
        <rect x="0" y="0" width="60" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="30" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#4ADE80">Gemini</text>
        <rect x="66" y="0" width="86" height="20" rx="10" fill="#07180D" stroke="#10B981" stroke-width="0.8"/>
        <text x="109" y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#00FF88">Open Source</text>
      </g>

      <!-- Bottom link indicator -->
      <text x="18" y="270" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#00FF88">🔗 View on GitHub →</text>
