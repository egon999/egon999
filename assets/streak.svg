<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="650" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="646" height="196" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Column: Total Contributions -->
  <g transform="translate(105, 100)">
    <text x="0" y="-12" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="32" font-weight="800" fill="#F8FAFC">
      1,480+
    </text>
    <text x="0" y="14" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
      Total Contributions
    </text>
    <text x="0" y="32" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" fill="#64748B">
      Oct 13, 2024 – Present
    </text>
  </g>

  <!-- Divider 1 -->
  <line x1="215" y1="40" x2="215" y2="160" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Center Column: Current Streak (88 Days) -->
  <g transform="translate(325, 95)">
    <!-- Glow Ring -->
    <circle cx="0" cy="-6" r="44" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="276" stroke-dashoffset="30" filter="url(#glow)" opacity="0.35"/>
    <circle cx="0" cy="-6" r="44" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-dasharray="276" stroke-dashoffset="40"/>
    
    <!-- Flame Icon -->
    <path d="M-6 -38 C-2 -46, 2 -46, 6 -38 C10 -30, 8 -24, 6 -20 C10 -22, 12 -18, 10 -12 C8 -6, 2 -2, -2 -2 C-6 -2, -10 -6, -8 -14 C-7 -18, -4 -20, -2 -24 C-4 -22, -8 -30, -6 -38 Z" fill="url(#fireGrad)" filter="url(#glow)"/>
    
    <!-- 88 Streak Number -->
    <text x="0" y="3" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="34" font-weight="900" fill="#38BDF8">
      88
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">
      Current Streak
    </text>
    <text x="0" y="42" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">
      88 Days Continuous 🔥
    </text>
  </g>

  <!-- Divider 2 -->
  <line x1="435" y1="40" x2="435" y2="160" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Right Column: Longest Streak -->
  <g transform="translate(540, 100)">
    <text x="0" y="-12" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="32" font-weight="800" fill="#F8FAFC">
      88
    </text>
    <text x="0" y="14" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
      Longest Streak
    </text>
    <text x="0" y="32" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" fill="#64748B">
      Consistent Active Daily
    </text>
  </g>

  <!-- Bottom Accent Strip -->
  <rect x="235" y="186" width="180" height="3" rx="1.5" fill="url(#cyanGrad)"/>
</svg>
