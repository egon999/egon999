<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040805"/>
      <stop offset="50%" stop-color="#08140D"/>
      <stop offset="100%" stop-color="#040805"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07130A"/>
      <stop offset="100%" stop-color="#0E2415"/>
    </linearGradient>
    <linearGradient id="emeraldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="876" height="316" rx="24" fill="url(#eduBg)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Header -->
  <g transform="translate(440, 40)" text-anchor="middle">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="900" fill="#F8FAFC">
      EDUCATION &amp; <tspan fill="url(#emeraldText)">MILESTONES</tspan>
    </text>
    <text x="0" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="1">
      ACADEMIC FOUNDATION &amp; SELF-DIRECTED ENGINEERING PATH
    </text>
  </g>

  <!-- 3 Timeline Cards (ZERO school names) -->
  <g transform="translate(48, 90)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="248" height="190" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#00FF88">Senior Secondary (Class 12th)</text>
      <text x="18" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#F1F5F9">Science &amp; Mathematics Stream</text>
      <text x="18" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">2024 – 2026</text>
      <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">
        <tspan x="18" dy="0">Balancing high-level academic</tspan>
        <tspan x="18" dy="16">rigor (Physics, Math, CS) with</tspan>
        <tspan x="18" dy="16">architecting production-ready</tspan>
        <tspan x="18" dy="16">software systems.</tspan>
      </text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(268, 0)">
      <rect x="0" y="0" width="248" height="190" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#00FF88">Founder &amp; Systems Architect</text>
      <text x="18" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#F1F5F9">Elevate ERP &amp; Omniflux</text>
      <text x="18" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">2024 – Present</text>
      <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">
        <tspan x="18" dy="0">Spearheading end-to-end</tspan>
        <tspan x="18" dy="16">autonomous enterprise software,</tspan>
        <tspan x="18" dy="16">multi-tenant state machines, and</tspan>
        <tspan x="18" dy="16">high-velocity prototypes.</tspan>
      </text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(536, 0)">
      <rect x="0" y="0" width="248" height="190" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#00FF88">Systems, Forensics &amp; Motion</text>
      <text x="18" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#F1F5F9">Win32, C2PA &amp; After Effects</text>
      <text x="18" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">2023 – Present</text>
      <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">
        <tspan x="18" dy="0">Deep reverse-engineering of</tspan>
        <tspan x="18" dy="16">Windows NT internals, anti-cheat</tspan>
        <tspan x="18" dy="16">forensic scans, media provenance,</tspan>
        <tspan x="18" dy="16">&amp; After Effects motion design.</tspan>
      </text>
    </g>
  </g>
</svg>