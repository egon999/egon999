<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 72" width="880" height="72">
  <defs>
    <linearGradient id="stripBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A07"/>
      <stop offset="50%" stop-color="#09180F"/>
      <stop offset="100%" stop-color="#050A07"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="68" rx="20" fill="url(#stripBg)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Badges Row -->
  <g transform="translate(30, 22)">
    <!-- React 19 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="92" height="28" rx="14" fill="#07130B" stroke="#00FF88" stroke-width="1" stroke-opacity="0.4"/>
      <text x="46" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#00FF88">⚛️ React 19</text>
    </g>

    <!-- Next.js 15 -->
    <g transform="translate(104, 0)">
      <rect x="0" y="0" width="102" height="28" rx="14" fill="#07130B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="51" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">▲ Next.js 15</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(218, 0)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#07130B" stroke="#00FF88" stroke-width="1" stroke-opacity="0.4"/>
      <text x="52" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">TS TypeScript</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(335, 0)">
      <rect x="0" y="0" width="88" height="28" rx="14" fill="#07130B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ADE80">🟢 Node.js</text>
    </g>

    <!-- Python -->
    <g transform="translate(435, 0)">
      <rect x="0" y="0" width="84" height="28" rx="14" fill="#07130B" stroke="#00FF88" stroke-width="1" stroke-opacity="0.4"/>
      <text x="42" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE047">🐍 Python</text>
    </g>

    <!-- Java -->
    <g transform="translate(531, 0)">
      <rect x="0" y="0" width="76" height="28" rx="14" fill="#07130B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="38" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FB923C">☕ Java</text>
    </g>

    <!-- C++ / Win32 -->
    <g transform="translate(619, 0)">
      <rect x="0" y="0" width="102" height="28" rx="14" fill="#07130B" stroke="#00FF88" stroke-width="1" stroke-opacity="0.4"/>
      <text x="51" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#A78BFA">⚡ C++ / Win32</text>
    </g>

    <!-- Agentic AI -->
    <g transform="translate(733, 0)">
      <rect x="0" y="0" width="86" height="28" rx="14" fill="#07130B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="43" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#00FF88">🤖 Agents</text>
    </g>
  </g>
</svg>